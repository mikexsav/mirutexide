# Host Nginx configuration for the Mirutex demo server.
# These zones belong to the http context (sites-enabled is included there on Ubuntu).
limit_req_zone $binary_remote_addr zone=mirutex_read:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=mirutex_entry:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=mirutex_auth:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=mirutex_storage:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=mirutex_run:10m rate=1r/s;
server {
    listen 80 default_server;
    server_name 193.233.247.61;
    location /.well-known/acme-challenge/ { root /var/www/mirutex-acme; }
    location / { return 301 https://193.233.247.61$request_uri; }
}
server {
    listen 443 ssl;
    server_name 193.233.247.61;
    ssl_certificate /etc/letsencrypt/live/mirutex-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirutex-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    limit_req_status 429;
    auth_basic "Mirutex IDE";
    auth_basic_user_file /etc/nginx/mirutex.htpasswd;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = / {
        auth_basic off;
        limit_req zone=mirutex_entry burst=20 nodelay;
        proxy_pass http://127.0.0.1:5173;
        add_header Cache-Control "no-store" always;
    }
    location /demo/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:5173;
        add_header Cache-Control "no-store" always;
    }
    location /share/ {
        auth_basic off;
        access_log off;
        proxy_pass http://127.0.0.1:5173;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy no-referrer always;
    }
    location ^~ /api/auth/ {
        auth_basic off;
        limit_req zone=mirutex_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:5173;
    }
    location ^~ /api/workspaces {
        auth_basic off;
        limit_req zone=mirutex_storage burst=12 nodelay;
        proxy_pass http://127.0.0.1:5173;
    }
    location ^~ /api/shares/ {
        auth_basic off;
        access_log off;
        limit_req zone=mirutex_read burst=12 nodelay;
        proxy_pass http://127.0.0.1:5173;
    }
    # Account sessions and CSRF are validated by the API before a runner is used.
    location ~ ^/api/(compile|execute|refactor|tests/compare|graph/edit)$ {
        auth_basic off;
        limit_req zone=mirutex_run burst=3 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:5173;
    }
    location /assets/ { auth_basic off; proxy_pass http://127.0.0.1:5173; }
    location = /mirutex.png { auth_basic off; proxy_pass http://127.0.0.1:5173; }
    location = /health {
        auth_basic off;
        limit_req zone=mirutex_read burst=12 nodelay;
        proxy_pass http://127.0.0.1:5173;
    }
    # Anonymous inspection is retained. Changed graph/generate sources require an account in the API.
    location ~ ^/api/(graph/(parse|generate)|analysis|files/(upload|download))$ {
        auth_basic off;
        limit_req zone=mirutex_read burst=12 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:5173;
    }
    location / { proxy_pass http://127.0.0.1:5173; }
}
